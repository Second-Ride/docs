            - S50/S51/S70: conversion-manual/MID50/02-s50-s51-s70/index.md
            - Drosselung:
                - "Antrieb drosseln": conversion-manual/MID50/throttling/how-to-throttle-your-drive/index.md
                - "Drosselung prüfen": conversion-manual/MID50/throttling/how-to-check-throttling/index.md
        - SR24:
            - S50/S51: conversion-manual/SR24/01-s50-s51/index.md
            - Schwalbe: conversion-manual/SR24/02-schwalbe/index.md
            - SR50: conversion-manual/SR24/03-sr50/index.md
            - Duo: conversion-manual/SR24/04-duo/index.md
            - Vogelserie: conversion-manual/SR24/05-vogelserie/index.md
        - "12V Schaltpläne": conversion-manual/12v-wiring-diagrams/index.md
        - "Änderungsabnahme & Zulassung": conversion-manual/modification-approval-and-homologation/index.md
    - Bedienungsanleitung:
