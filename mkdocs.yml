site_name: Second Ride Dokumentation
site_description: 'Umfassende Dokumentation zu Elektro-Umbaukits von Second Ride'
site_url: https://docs.second-ride.de/
repo_url: https://github.com/Second-Ride/docs/
edit_uri: https://github.com/Second-Ride/docs/edit/main/docs

# Die englischen Übersetzungen (*.en.md) werden ohne Mehrsprachigkeit nicht
# mitgebaut: Sie hängen an keiner Navigation und landeten sonst in der
# deutschen Suche (rund ein Drittel aller Treffer). Bei Bedarf i18n-Plugin
# unten aktivieren und diese Zeile entfernen.
exclude_docs: |
  *.en.md

# Technische Auszeichnung beim Bauen (Schrittnummern, Positionsnummern,
# LED-Punkte, Werte); das Markdown bleibt unverändert. Siehe Datei.
hooks:
  - hooks/sr_content.py
  - hooks/sr_consent_embeds.py
  - hooks/llms_bot.py
  - hooks/sr_assets.py
  - hooks/redirects.py

extra_css:
    - stylesheets/theme.css
    - stylesheets/feedback.css

markdown_extensions:
  - admonition
  - pymdownx.quotes:
      callouts: true
  - def_list
  - attr_list
  - md_in_html
  #- meta
  - toc:
      permalink: "#"
      permalink_title: Link zu diesem Abschnitt
  - footnotes
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
        

theme:
    name: material
    custom_dir: overrides
    language: de
    logo: img/Bildmarke_Weiss.svg
    favicon: img/favicon.ico
    # Nunito Sans wie auf der Website, selbst gehostet (stylesheets/theme.css)
    font: false
    # Lucide wie auf der Website (overrides/.icons/lucide), Strichstärke 1.75
    icon:
        menu: lucide/menu
        search: lucide/search
        close: lucide/x
        top: lucide/arrow-up
        edit: lucide/square-pen
        view: lucide/eye
        repo: fontawesome/brands/github
        previous: lucide/arrow-left
        next: lucide/arrow-right
        admonition:
            note: lucide/pencil-line
            abstract: lucide/clipboard-list
            info: lucide/info
            tip: lucide/lightbulb
            success: lucide/check
            question: lucide/circle-question-mark
            warning: lucide/triangle-alert
            failure: lucide/x
            danger: lucide/octagon-alert
            bug: lucide/bug
            example: lucide/flask-conical
            quote: lucide/quote
    features:
        - navigation.footer
        - navigation.instant
        - navigation.instant.prefetch
        - navigation.instant.progress
        - navigation.tracking
        - navigation.tabs
        - navigation.tabs.sticky
        - toc.follow
        - navigation.top
        - content.tabs.link
        - content.action.edit
        - content.code.copy
        - navigation.path
        #- i18n
   

    # Hell zuerst, wie die Website. Welche Palette gilt, entscheidet
    # javascripts/theme.js: die gespeicherte Wahl, sonst das System.
    palette:
        - media: "(prefers-color-scheme: light)"
          primary: custom
          accent: custom
          scheme: default
          toggle:
            icon: lucide/moon
            name: Dunkles Design

        - media: "(prefers-color-scheme: dark)"
          primary: custom
          accent: custom
          scheme: slate
          toggle:
            icon: lucide/sun
            name: Helles Design
plugins:
    - glightbox:
        draggable: false
        # Freisteller mit transparentem Hintergrund im Viewer auf Weiß, Fotos ohne Schatten
        background: white
        shadow: false
    - social:
        enabled: !ENV [CI, false]
        cards_layout_options:
            background_color: "#050505"
            color: "#E4B854"
            font_family: Nunito Sans
    - search
    - llmstxt:
        full_output: llms-full.txt
        sections:
          Umbauanleitung:
            - conversion-manual/**/index.md
          Bedienungsanleitung:
            - user-manual/**/index.md
          Für Entwickler:
            - for-developers/**/index.md
          FAQ:
            - faq/**/index.md
     #-i18n:
       #docs_structure: suffix
       #languages:
         #- locale: de
           #name: Deutsch
           #default: true
           #search:
            #language: de
            #translations:
              #search:
                #label: "Suche"
                #placeholder: "Suche"
         #- locale: en
           #name: English
           #nav_translations:
             #"Home": "Home"
             #"Umbauanleitung": "Conversion manual"
             #"Übersicht": "Overview"
             #"SR24": "SR24"
             #"S50/S51": "S50/S51"
             #"Schwalbe": "Schwalbe"
             #"SR50": "SR50"
             #"Duo": "Duo"
             #"Vogelserie": "Vogelserie"
             #"Bedienungsanleitung": "User manual"
             #"01 Antrieb & Akku": "01 Drive unit & battery"
             #"02 App": "02 App"
             #"03 Update": "03 Update"
             #"04 Externer Ladeanschluss": "04 External charging port"
             #"05 E-Kupplung": "05 E-clutch"
             #"Änderungsabnahme & Zulassung": "Modification approval & homologation"
             #"Für Entwickler": "For developers"
             #"Kommunikationsprotokolle": "Communication protocols"
