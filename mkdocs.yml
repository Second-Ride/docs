extra:
  # Reihenfolge, Links und Logos wie in der Fußzeile der Website
  # (packages/config/src/site.ts, SOCIAL_LINKS und SOCIAL_ICON_PATHS)
  social:
    - icon: sr/youtube
      name: YouTube
      link: https://www.youtube.com/@second-ride
    - icon: sr/facebook
      name: Facebook
      link: https://www.facebook.com/secondridegmbh
    - icon: sr/linkedin
      name: LinkedIn
      link: https://de.linkedin.com/company/second-ride
    - icon: sr/instagram
      name: Instagram
      link: https://www.instagram.com/second_ride_/
    - icon: sr/tiktok
      name: TikTok
      link: https://www.tiktok.com/@second.ride
    - icon: sr/discord
      name: Discord
      link: https://discord.com/invite/jbWrdN6NK7
  # Cookie-Banner und Einwilligung kommen von second-ride.de (/consent.js, siehe
  # overrides/main.html), nicht von Material. Die Entscheidung gilt auf beiden
  # Seiten. GA4 lädt die Engine erst nach Einwilligung in Statistik.
  ga4_property: G-YZJB651WB8
  consent_script: https://second-ride.de/consent.js
  # Rückmeldung am Seitenende (overrides/partials/feedback.html).
  # Ohne `endpoint` gibt es nur einen Link, der bei GitHub ein vorausgefülltes
  # Issue öffnet. Mit `endpoint` ein Formular ohne GitHub-Konto, das der Worker
  # aus feedback-worker/ entgegennimmt (Einrichtung dort in der README):
  #   endpoint: /api/feedback
  feedback:
    issues_url: https://github.com/Second-Ride/docs/issues
    label: doku-feedback
  generator: false
  # Weiterleitungen für umgezogene Doku-Seiten, umgesetzt in hooks/redirects.py.
  # Schlüssel: alte Seite, Wert: neue Seite der Doku oder fremde Adresse. Gedruckte
  # Anleitungen, Mails und Forenbeiträge verweisen noch auf die alten Adressen.
  redirect_maps:
    # Ordnerumbenennungen im Sommer 2025 (Umbauanleitung, customer-manual, instruction-manual)
    Umbauanleitung/SR24/01-s50-s51/index.md: conversion-manual/SR24/01-s50-s51/index.md
    Umbauanleitung/SR24/02-schwalbe/index.md: conversion-manual/SR24/02-schwalbe/index.md
    Umbauanleitung/SR24/03-sr50/index.md: conversion-manual/SR24/03-sr50/index.md
    Umbauanleitung/SR24/04-duo/index.md: conversion-manual/SR24/04-duo/index.md
    Umbauanleitung/SR24/05-vogelserie/index.md: conversion-manual/SR24/05-vogelserie/index.md
    umbauanleitung/SR24/01-s50-s51/index.md: conversion-manual/SR24/01-s50-s51/index.md
    umbauanleitung/SR24/02-schwalbe/index.md: conversion-manual/SR24/02-schwalbe/index.md
    umbauanleitung/SR24/03-sr50/index.md: conversion-manual/SR24/03-sr50/index.md
    umbauanleitung/SR24/04-duo/index.md: conversion-manual/SR24/04-duo/index.md
    umbauanleitung/SR24/05-vogelserie/index.md: conversion-manual/SR24/05-vogelserie/index.md
    instruction-manual/SR24/01-drive-unit-and-battery/index.md: user-manual/SR24/01-drive-unit-and-battery/index.md
    customer-manual/SR24/01-drive-unit-and-battery/index.md: user-manual/SR24/01-drive-unit-and-battery/index.md
    customer-manual/SR24/02-app/index.md: user-manual/second-ride-app/index.md
    customer-manual/SR24/03-update/index.md: user-manual/SR24/03-firmware-update/index.md
    customer-manual/SR24/03-updates/index.md: user-manual/SR24/03-firmware-update/index.md
    customer-manual/SR24/04-externer-ladeport/index.md: user-manual/SR24/04-externer-ladeport/index.md
    customer-manual/SR24/05-electric-clutch/index.md: user-manual/SR24/05-electric-clutch/index.md
    customer-manual/modification-approval-and-homologation/index.md: conversion-manual/modification-approval-and-homologation/index.md
    # Umbenennungen im November 2025
    user-manual/SR24/02-app/index.md: user-manual/second-ride-app/index.md
    user-manual/SR24/03-update/index.md: user-manual/SR24/03-firmware-update/index.md
    user-manual/SR24/06-bt-module/index.md: user-manual/SR24/02-bt-module/index.md
    user-manual/modification-approval-and-homologation/index.md: conversion-manual/modification-approval-and-homologation/index.md
    # Umbenennungen 2026
    technische-abnahme/index.md: conversion-manual/MID50/throttling/how-to-check-throttling/index.md
    conversion-manual/MID50/02-s50-s51/index.md: conversion-manual/MID50/02-s50-s51-s70/index.md
    # Frühere leere Seite, auf die alte QR-Codes der Community-Einladung zeigen können
    second-ride.de/community-gast.md: https://second-ride.de/community-gast

copyright: >
  <a href="https://second-ride.de/cookies" data-consent-renew>Cookie Einstellungen</a> <br>
  <a href="https://second-ride.de/impressum">Impressum</a>

