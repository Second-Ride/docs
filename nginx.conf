server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    charset utf-8;
    charset_types text/plain text/markdown text/css application/javascript application/json application/xml image/svg+xml;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/markdown text/css application/javascript application/json application/xml image/svg+xml;

    # Markdown-Fassungen der Doku, wie bisher im Caddyfile
    location = /all-docs { types { } default_type "text/markdown; charset=utf-8"; }
    location = /llms.txt { types { } default_type "text/markdown; charset=utf-8"; }
    location ~ \.md$     { types { } default_type "text/markdown; charset=utf-8"; }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
